# PostgreSQL for the event log. Host port 55432 avoids clashing with a local Postgres.
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql  # the 18+ image keeps its data under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
